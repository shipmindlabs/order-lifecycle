[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "order-lifecycle"
version = "0.1.0"
description = "Declarative state machine for order lifecycles: role-guarded transitions, hooks, cancellation paths and a readable history."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Shipmind Labs", email = "hello@shipmindlabs.com" }]
keywords = ["state-machine", "orders", "workflow", "lifecycle"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/shipmindlabs/order-lifecycle"
Source = "https://github.com/shipmindlabs/order-lifecycle"
Issues = "https://github.com/shipmindlabs/order-lifecycle/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/order_lifecycle"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
